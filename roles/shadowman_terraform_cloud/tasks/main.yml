---
- name: Update number_of_instances if defined
  hashicorp.terraform.variable:
    workspace_id: "{{ workspace_id }}"
    key: "number_of_instances"
    tfe_token: "{{ hcpterraform_api_token }}"
    value: "{{ numinstances }}"
    category: "terraform"
    state: present
  when: numinstances is defined

- name: Update prefix if defined
  hashicorp.terraform.variable:
    workspace_id: "{{ workspace_id }}"
    key: "instance_name_convention"
    tfe_token: "{{ hcpterraform_api_token }}"
    value: "{{ prefix }}"
    category: "terraform"
    state: present
  when: prefix is defined

- name: Update OS if defined
  hashicorp.terraform.variable:
    workspace_id: "{{ workspace_id }}"
    key: "rhel_version"
    tfe_token: "{{ hcpterraform_api_token }}"
    value: "{{ operating_system }}"
    category: "terraform"
    state: present
  when: operating_system is defined

- name: Perform Terraform Plan
  hashicorp.terraform.run:
    workspace_id: "{{ workspace_id }}"
    auto_apply: false
    state: present
    tf_token: "{{ hcpterraform_api_token }}"
  register: terraformplanresponse

- name: Get json plan information by run ID
  hashicorp.terraform.view_plan:
    plan_id: "{{ terraformplanresponse.plan.id }}"
    tf_token: "{{ hcpterraform_api_token }}"
    output_format: json
  register: terraformplanresult

- name: Get before and after states
  ansible.builtin.set_fact:
    terraformbefore: "{{ terraformplanresult.json_output.output_changes.vm_name_terraformvms.before | default([]) }}"
    terraformafter: "{{ terraformplanresult.json_output.output_changes.vm_name_terraformvms.after | default([]) }}"

- name: Set fact of VMs to be deleted
  ansible.builtin.set_fact:
    vmstodelete: "{{ terraformbefore | difference(terraformafter) }}"

- name: Set fact of VMs to be configured
  ansible.builtin.set_fact:
    vmstoadd: "{{ terraformafter | difference(terraformbefore) }}"

- name: Unsubscribe VMs
  ansible.controller.workflow_launch:
    workflow_template: "Unsubscribe VMs for Terraform"
    extra_vars:
      vm_name: "{{ vmstodelete | join(',') }}"
      ticket_number: "{{ ticket_number | default(omit) }}"
    wait: true
  when: vmstodelete | length > 0

- name: Apply the existing plan
  hashicorp.terraform.run:
    run_id: "{{ terraformplanresponse.id }}"
    tf_token: "{{ hcpterraform_api_token }}"
    state: "applied"
    poll: true
    poll_timeout: 600
    poll_interval: 10

- name: Set hostnames if VMWare
  ansible.controller.job_launch:
    job_template: "Hostname Set VMWare"
    extra_vars:
      vm_name: "{{ vmstoadd | join(',') }}"
      operating_system: "{{ operating_system }}"
    wait: true
  when:
    - jsonoutput.configuration.provider_config.vsphere.name is defined
    - vmstoadd | length > 0

- name: Set VMWare as Hypervisor
  ansible.builtin.set_fact:
    shadowman_provision_hypervisor: VMWare
  when: terraformplanresult.json_output.configuration.provider_config.vsphere.name is defined

- name: Set AWS as Hypervisor
  ansible.builtin.set_fact:
    shadowman_provision_hypervisor: AWS
  when: terraformplanresult.json_output.configuration.provider_config.aws.name is defined

- name: Set Azure as Hypervisor
  ansible.builtin.set_fact:
    shadowman_provision_hypervisor: Azure
  when: terraformplanresult.json_output.configuration.provider_config.azurerm.name is defined

- name: Config VM, Deploy Web App with Failure Paths Citrix
  ansible.controller.workflow_launch:
    workflow_template: "Config VM, Deploy Web App with Failure Paths Citrix"
    extra_vars:
      vm_name: "{{ vmstoadd | join(',') }}"
      ticket_number: "{{ ticket_number | default(omit) }}"
      shadowman_provision_hypervisor: "{{ shadowman_provision_hypervisor }}"
    wait: true
  when: vmstoadd | length > 0
